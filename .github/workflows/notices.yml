# Daily notices run: notices change often, the rest of the website rarely. Monday to Saturday at
# 05:00 UTC (07:00 Italian summer time, 06:00 in winter); on Sunday there is the full run
# (`pipeline.yml`).
#
# - The crawler reads only the first page of the notices list and downloads only the notices not yet
#   in D1, with their attachments (not those already in D1): usually 1–3 requests.
# - `pipeline.run --additions-only`: adds or updates, no absences nor deletions (left to the Sunday
#   run). In `runs` the outcome is "ok_notices".
# - Same rules as `pipeline.yml`: secrets in the `pipeline` Environment, empty `cache/`, no cache nor
#   artifacts, same `concurrency` group (never two writing runs together).
name: notices

on:
  schedule:
    - cron: "0 5 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: pipeline
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CRAWLER_CONTACT: ${{ secrets.CRAWLER_CONTACT }}
      CRAWLER_NAME: ${{ vars.CRAWLER_NAME }}
      CRAWLER_INFO_URL: ${{ vars.CRAWLER_INFO_URL }}
      CRAWLER_FULL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked --no-dev
      - name: Empty local copy
        run: rm -rf cache && mkdir cache
      - name: Crawler (new notices only)
        id: crawler
        continue-on-error: true
        run: uv run python -m pipeline.crawl --notices-only
      - name: Vectorize and D1 (additions only)
        run: uv run python -m pipeline.run --additions-only
      - name: Crawler outcome
        if: steps.crawler.outcome == 'failure'
        run: |
          echo "::error::crawler stopped or failed: see the Crawler step"
          exit 1
